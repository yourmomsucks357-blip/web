<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snap Before U Scrap - Reset Password</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="index.html">Snap Before U Scrap</a>
      <nav class="nav-links">
        <a href="listings.html">Listings</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a class="btn btn-outline" href="auth-login.html">Sign In</a>
    </div>
  </header>

  <main class="auth-shell">
    <section class="card card-pad auth-card">
      <h1 style="font-size:1.45rem;line-height:1.25;margin-bottom:0.35rem;">Reset your password</h1>
      <p class="helper" style="margin-bottom:0.9rem;">Enter your account email and we will send a secure reset link.</p>

      <form class="form-stack" action="#" method="post">
        <label class="label" for="email">Email Address</label>
        <input id="email" class="input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required />
        <button class="btn btn-primary" data-track-cta type="submit">Send Reset Link</button>
      </form>

      <div class="divider"></div>
      <p class="helper">Remembered it? <a href="auth-login.html" style="">Return to sign in</a>.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
