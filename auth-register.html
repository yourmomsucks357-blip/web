<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Snap Before U Scrap - Create Account</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="index.html">Snap Before U Scrap</a>
      <nav class="nav-links">
        <a href="listings.html">Listings</a>
        <a href="how-it-works.html">How It Works</a>
        <a href="contact.html">Contact</a>
      </nav>
      <a class="btn btn-outline" href="auth-login.html">Sign In</a>
    </div>
  </header>

  <main class="auth-shell">
    <section class="card card-pad auth-card">
      <h1 style="font-size:1.5rem;line-height:1.25;margin-bottom:0.35rem;">Create your seller account</h1>
      <p class="helper" style="margin-bottom:0.9rem;">Start listing parts, receive real offers, and track every bid from one dashboard.</p>

      <form class="form-stack" action="#" method="post">
        <label class="label" for="name">Full Name</label>
        <input id="name" class="input" type="text" name="name" autocomplete="name" placeholder="Your full name" required />

        <label class="label" for="email">Email Address</label>
        <input id="email" class="input" type="email" name="email" autocomplete="email" placeholder="you@example.com" required />

        <label class="label" for="password">Password</label>
        <input id="password" class="input" type="password" name="password" autocomplete="new-password" placeholder="Create a strong password" required />

        <label class="label" for="yard">Primary Pickup ZIP Code</label>
        <input id="yard" class="input" type="text" name="yard" inputmode="numeric" placeholder="e.g. 60618" required />

        <button class="btn btn-primary" data-track-cta type="submit">Create Account</button>
      </form>

      <div class="divider"></div>
      <p class="helper">Already have an account? <a href="auth-login.html" style="">Sign in</a>.</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
